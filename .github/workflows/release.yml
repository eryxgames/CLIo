# Release: push a tag like v2.2.0 and this workflow
#   1. checks the tag matches __version__ in engine/__init__.py and that CHANGELOG.md has a
#      "## 2.2.0" section (a date after the number is fine),
#   2. runs the tests,
#   3. makes a GitHub release with that section as its notes, the engine as a zip and the
#      editor's web pack (python -m engine.editor.hosted --pack),
#   4. pushes both to itch.io with butler (if the BUTLER_API_KEY secret is set).
#
# itch.io channels: "win-linux-mac" (the engine; pure Python 3.8+, standard library only) and
# "html5" (the editor in the browser; tick "played in the browser" on that upload once).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ITCH_PROJECT: eryxgames/clio
  PYTHON_VERSION: "3.12"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Tag matches the engine's version and the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          engine=$(python3 -c "import re; print(re.search(r'^__version__ = \"(.+)\"', open('engine/__init__.py').read(), re.M).group(1))")
          echo "tag $version, engine $engine"
          test "$version" = "$engine"
          awk -v v="$version" '$1=="##" && $2==v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Pack
        run: |
          mkdir -p pack
          git archive --format=tar --prefix="clio-$VERSION/" HEAD -- . ':(exclude).github' | tar -x -C pack
          (cd pack && zip -qr "../clio-$VERSION.zip" "clio-$VERSION")
          python -m engine.editor.hosted --pack "clio-editor-$VERSION.zip"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "clio-$VERSION.zip" "clio-editor-$VERSION.zip" \
            --title "CLIo $VERSION" --notes-file notes.md
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "No BUTLER_API_KEY secret: skipping itch.io"; exit 0; fi
          curl -fsSL --retry 5 -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler -V
          ./butler/butler push "pack/clio-$VERSION" "$ITCH_PROJECT:win-linux-mac" --userversion "$VERSION"
          ./butler/butler push "clio-editor-$VERSION.zip" "$ITCH_PROJECT:html5" --userversion "$VERSION"
