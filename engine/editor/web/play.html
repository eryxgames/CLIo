<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CLIo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0b10'/%3E%3Ccircle cx='11' cy='10' r='3.4' fill='%23ffb729'/%3E%3Cpath d='M7 4H4v8h3' stroke='%232f8aff' stroke-width='2.2' fill='none'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; color: #d6ecff; font: 15px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #screen { flex: 1; min-height: 0; padding: 4px; box-sizing: border-box; }
  #bar { display: flex; align-items: center; gap: .5em; padding: 3px 8px; background: #14161f; font-size: 13px; }
  #bar[hidden] { display: none; }
  #bar span { flex: 1; color: #9fb8d6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bar button { font: inherit; color: #d6ecff; background: #22263a; border: 1px solid #3a4060; border-radius: 6px;
                padding: 2px 10px; cursor: pointer; }
  #screen .xterm { height: 100%; }
  #keys { display: none; gap: 4px; padding: 4px; flex-wrap: wrap; justify-content: center; background: #14161f; }
  body.touch #keys { display: flex; }
  #keys button { flex: 1 0 2.6em; max-width: 4.5em; min-height: 2.6em; font: inherit; font-size: 14px; color: #d6ecff;
                 background: #22263a; border: 1px solid #3a4060; border-radius: 6px; touch-action: manipulation; }
  #keys button:active { background: #2f8aff; }
  #cover { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0b0b10ee;
           text-align: center; padding: 2em; }
  #cover[hidden] { display: none; }
  #cover .box { max-width: 34em; }
  #cover h1 { margin: 0 0 .4em; font-size: 1.6em; color: #ffb729; }
  #cover p { margin: .5em 0; }
  #cover a, #cover button { display: inline-block; margin: .4em; padding: .55em 1.1em; border-radius: 8px; border: 0;
                             background: #ffb729; color: #0b0b10; font: inherit; font-weight: 600; text-decoration: none;
                             cursor: pointer; }
  #cover a.quiet, #cover button.quiet { background: #22263a; color: #d6ecff; }
  #cover pre { text-align: left; white-space: pre-wrap; font-size: 12px; color: #ff9a9a; }
</style>
</head>
<body>
<div id="bar" hidden><span id="bar-title"></span><button type="button" id="bar-again">Restart</button><button type="button" id="bar-back">Back to the editor</button></div>
<div id="screen" aria-label="The game's terminal"></div>
<div id="keys" aria-label="Keys">
  <button data-key="&#27;">Esc</button><button data-key="&#9;">Tab</button><button data-key="&#27;[D">&#8592;</button>
  <button data-key="&#27;[A">&#8593;</button><button data-key="&#27;[B">&#8595;</button><button data-key="&#27;[C">&#8594;</button>
  <button data-key=",">&#8676;</button><button data-key=".">&#8677;</button><button data-key=" ">Fire</button>
  <button data-key="&#13;">Enter</button><button data-key="]">Next</button><button id="type">abc</button>
</div>
<div id="cover" role="status" aria-live="polite">
  <div class="box">
    <h1>CLIo</h1>
    <p id="say">Opening the terminal…</p>
    <div id="choices"></div>
  </div>
</div>
<script type="module" src="play.mjs"></script>
</body>
</html>
